<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>题库练习 - 1736题</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --green:#2ecc71; --green-dark:#27ae60; --green-light:#e8f8f0; --bg:#f0f5f1; --card:#fff; --text:#333; --text-light:#888; --border:#e8e8e8; --red:#e74c3c; --orange:#f39c12; }
html,body { height:100%; overflow:hidden; }
body { font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); font-size:15px; line-height:1.6; }

.topbar { position:fixed; top:0; left:0; right:0; z-index:100; background:linear-gradient(135deg,var(--green),var(--green-dark)); color:#fff; padding:12px 16px; box-shadow:0 2px 8px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:space-between; }
.topbar .title { font-size:16px; font-weight:600; }
.topbar .progress-info { font-size:12px; opacity:.9; }

.progress-bar { position:fixed; top:52px; left:0; right:0; height:3px; background:rgba(0,0,0,.08); z-index:99; }
.progress-bar .fill { height:100%; background:#fff; border-radius:0 3px 3px 0; transition:width .3s; }

.content { padding:68px 12px 80px; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; }

.q-card { background:var(--card); border-radius:12px; padding:20px 16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.q-meta { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.q-num { background:var(--green); color:#fff; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; flex-shrink:0; }
.q-type { background:var(--green-light); color:var(--green-dark); padding:2px 10px; border-radius:10px; font-size:11px; }
.q-title { font-size:16px; font-weight:500; line-height:1.8; margin-bottom:16px; }

.q-options { margin-bottom:16px; }
.q-opt { padding:10px 12px; margin-bottom:8px; border:2px solid var(--border); border-radius:8px; font-size:14px; transition:all .2s; cursor:pointer; display:flex; align-items:flex-start; }
.q-opt:active { transform:scale(.98); }
.q-opt.correct { border-color:var(--green); background:var(--green-light); color:var(--green-dark); font-weight:600; }
.q-opt.wrong { border-color:var(--red); background:#fdf0ef; color:var(--red); }
.q-opt .letter { display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:50%; background:var(--border); color:var(--text); font-size:12px; margin-right:8px; flex-shrink:0; }
.q-opt.correct .letter { background:var(--green); color:#fff; }
.q-opt.wrong .letter { background:var(--red); color:#fff; }
.q-opt .opt-text { flex:1; }
.q-opt.judge { justify-content:center; }

.q-answer { display:none; margin-top:12px; padding:12px; background:var(--green-light); border-radius:8px; border-left:3px solid var(--green); }
.q-answer.show { display:block; }
.q-answer .label { color:var(--green-dark); font-weight:600; font-size:14px; }
.q-answer .text { margin-top:4px; font-size:14px; line-height:1.6; }

.short-answer { margin-top:12px; padding:12px; background:var(--green-light); border-radius:8px; border-left:3px solid var(--green); }
.short-answer .label { color:var(--green-dark); font-weight:600; font-size:14px; }
.short-answer .text { margin-top:4px; font-size:14px; line-height:1.6; }

.mark-bar { display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }

.show-answer-btn { display:block; width:100%; padding:10px; margin-bottom:12px; border:2px solid var(--green); background:var(--green-light); color:var(--green-dark); border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; }
.show-answer-btn:active { transform:scale(.98); }
.mark-familiar { display:flex; align-items:center; gap:8px; cursor:pointer; }
.mark-familiar input { width:20px; height:20px; accent-color:var(--orange); cursor:pointer; }
.mark-familiar label { font-size:14px; color:var(--text-light); cursor:pointer; }
.mark-familiar input:checked + label { color:var(--orange); font-weight:600; }

.navbar { position:fixed; bottom:0; left:0; right:0; z-index:100; background:#fff; border-top:1px solid var(--border); display:flex; padding:8px; gap:8px; box-shadow:0 -2px 8px rgba(0,0,0,.06); }
.navbar .nav-btn { flex:1; padding:10px; border:none; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; transition:all .2s; }
.nav-btn:active { transform:scale(.95); }
.btn-prev { background:var(--border); color:var(--text); }
.btn-next { background:var(--green); color:#fff; }
.btn-jump { background:var(--green-light); color:var(--green-dark); flex:0 0 auto; width:48px; font-size:18px; }
.btn-review { background:#fff3e0; color:var(--orange); flex:0 0 auto; padding:10px 12px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid var(--orange); position:relative; }
.btn-review .badge { position:absolute; top:-4px; right:-4px; background:var(--orange); color:#fff; font-size:10px; min-width:18px; height:18px; line-height:18px; border-radius:9px; padding:0 4px; text-align:center; }

.jump-modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:200; background:rgba(0,0,0,.5); align-items:center; justify-content:center; }
.jump-modal.show { display:flex; }
.jump-box { background:#fff; border-radius:12px; padding:20px; width:85%; max-width:320px; }
.jump-box h3 { text-align:center; margin-bottom:16px; font-size:16px; }
.jump-input { width:100%; padding:12px; border:2px solid var(--border); border-radius:8px; font-size:16px; text-align:center; outline:none; margin-bottom:12px; }
.jump-input:focus { border-color:var(--green); }
.jump-btns { display:flex; gap:8px; }
.jump-btns button { flex:1; padding:10px; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
.jump-cancel { background:var(--border); color:var(--text); }
.jump-go { background:var(--green); color:#fff; }

.review-modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:200; background:rgba(0,0,0,.5); }
.review-modal.show { display:block; overflow-y:auto; }
.review-box { background:#fff; border-radius:0; min-height:100%; padding:68px 12px 20px; }
.review-header { position:fixed; top:0; left:0; right:0; background:linear-gradient(135deg,var(--orange),#e67e22); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.review-header .r-title { font-size:16px; font-weight:600; }
.review-header .r-close { background:rgba(255,255,255,.2); border:none; color:#fff; width:30px; height:30px; border-radius:50%; font-size:18px; cursor:pointer; }
.review-item { background:var(--card); border-radius:8px; padding:14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.review-item .ri-meta { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.review-item .ri-num { background:var(--orange); color:#fff; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold; flex-shrink:0; }
.review-item .ri-type { background:#fff3e0; color:var(--orange); padding:1px 8px; border-radius:8px; font-size:10px; }
.review-item .ri-title { font-size:14px; margin-bottom:4px; line-height:1.6; }
.review-item .ri-answer { font-size:13px; color:var(--green-dark); margin-top:4px; word-break:break-all; }
.review-item .ri-go { background:var(--green-light); color:var(--green-dark); border:none; padding:6px 16px; border-radius:6px; font-size:12px; cursor:pointer; margin-top:6px; }
.review-item .ri-remove { background:#fdf0ef; color:var(--red); border:none; padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; margin-top:6px; margin-left:8px; }
.review-empty { text-align:center; padding:40px 20px; color:var(--text-light); }
.review-clear { background:rgba(255,255,255,.2); border:none; color:#fff; padding:4px 12px; border-radius:6px; font-size:12px; cursor:pointer; }

.stats-card { display:none; background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.stats-card.show { display:block; }
.stats-card h3 { font-size:14px; margin-bottom:12px; color:var(--text-light); }
.stats-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:14px; }
.stats-row:last-child { border:none; }
.stats-row .val { font-weight:600; color:var(--green-dark); }
.stats-clickable { cursor:pointer; }
.stats-clickable:active { background:var(--green-light); }
.stats-clickable .val { color:var(--orange); }
</style>
</head>
<body>

<div class="topbar">
  <div class="title" id="topTitle">题库练习</div>
  <div class="progress-info" id="progressInfo">0 / 1736</div>
</div>
<div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>

<div class="content" id="content">
  <div class="stats-card show" id="statsCard">
    <h3>题库概览</h3>
    <div class="stats-row stats-clickable" onclick="jumpToType('单选题')"><span>单选题</span><span class="val">1213</span></div>
    <div class="stats-row stats-clickable" onclick="jumpToType('判断题')"><span>判断题</span><span class="val">329</span></div>
    <div class="stats-row stats-clickable" onclick="jumpToType('多选题')"><span>多选题</span><span class="val">174</span></div>
    <div class="stats-row stats-clickable" onclick="jumpToType('简答题')"><span>简答题</span><span class="val">20</span></div>
    <div class="stats-row stats-clickable" onclick="showReviewModal()"><span>标记不熟悉</span><span class="val" id="statReview">0</span></div>
  </div>
  <div id="questionContainer"></div>
</div>

<div class="navbar">
  <button class="nav-btn btn-prev" onclick="prevQuestion()">上一题</button>
  <button class="nav-btn btn-jump" onclick="showJumpModal()">≡</button>
  <button class="nav-btn btn-next" onclick="nextQuestion()">下一题</button>
  <button class="btn-review" onclick="showReviewModal()">复习<span class="badge" id="reviewBadge" style="display:none">0</span></button>
</div>

<div class="jump-modal" id="jumpModal">
  <div class="jump-box">
    <h3>跳转到第几题</h3>
    <input type="number" class="jump-input" id="jumpInput" min="1" max="1736" placeholder="1 - 1736">
    <div class="jump-btns">
      <button class="jump-cancel" onclick="hideJumpModal()">取消</button>
      <button class="jump-go" onclick="doJump()">跳转</button>
    </div>
  </div>
</div>

<div class="review-modal" id="reviewModal">
  <div class="review-header">
    <span class="r-title">复习清单</span>
    <div>
      <button class="review-clear" onclick="clearReview()">清空</button>
      <button class="r-close" onclick="hideReviewModal()">&times;</button>
    </div>
  </div>
  <div class="review-box" id="reviewContent"></div>
</div>

题","q":"《中华人民共和国专利法》中，（ ）情况可以授予专利权。","o":"A|科学发现|0||B|智力活动的规则和方法|0||C|疾病的诊断和治疗方法|0||D|一种新型的机械装置|1","a":"D","at":"一种新型的机械装置"},{"i":1131,"t":"单选题","q":"对信息进行收集，整理，加工后向社会扩散，转移的全过程被称为（  ）。","o":"A|信息采集|0||B|信息集散|1||C|信息发布|0||D|信息整合|0","a":"B","at":"信息集散"},{"i":1132,"t":"单选题","q":"客户在（ ）方面的需求不是产品、服务所能替代或涵盖的，而是在产品、服务需求被满足后产生的更高层次的需求。","o":"A|质量|0||B|价格|0||C|体验|1||D|品牌|0","a":"C","at":"体验"},{"i":1133,"t":"单选题","q":"在项目管理中，三点估算技术通常不包括（ ）输入。","o":"A|最乐观时间|0||B|最悲观时间|0||C|最可能时间|0||D|平均时间|1","a":"D","at":"平均时间"},{"i":1134,"t":"单选题","q":"可行性研究报告的主要目的是（ ）。","o":"A|增加企业盈利|0||B|确定项目的可行性|1||C|评估企业资产|0||D|提高员工技能|0","a":"B","at":"确定项目的可行性"},{"i":1135,"t":"单选题","q":"分属不同细分市场的消费者对同一产品的消费需求呈现（ ）。","o":"A|同一性|0||B|趋同性|0||C|差异性|1||D|排斥性|0","a":"C","at":"差异性"},{"i":1136,"t":"单选题","q":"根据《中华人民共和国招标投标法》规定，（ ）通常需要进行招投标。","o":"A|个人购买日常用品|0||B|企业购买办公用品|0||C|政府采购大型基础设施项目|1||D|私人住宅装修|0","a":"C","at":"政府采购大型基础设施项目"},{"i":1137,"t":"单选题","q":"客户接洽在科技咨询活动中被视为（ ）。","o":"A|结束阶段|0||B|启动阶段|1||C|实施阶段|0||D|跟踪服务阶段|0","a":"B","at":"启动阶段"},{"i":1138,"t":"单选题","q":"在招投标过程中，政府监管部门通常不负责（ ）。","o":"A|监督投标方的资质审核|0||B|确保评标过程的公正性|0||C|设计和制定评标标准|1||D|处理投标方之间的争议|0","a":"C","at":"设计和制定评标标准"},{"i":1139,"t":"简答题","q":"在科技咨询项目中，如何确保客户信息的保密性和安全性？","o":"","a":"见答案解析","at":"在科技咨询项目中，确保客户信息的保密性和安全性至关重要。可以采取以下措施来保障客户信息的保密性和安全性：签订保密协议：与客户签订正式的保密协议，明确双方对客户信息保密的责任和义务。建立严格的保密制度：制定完善的保密管理制度，包括信息分类、存储、传输、使用和销毁等各个环节的保密措施。\n加强信息安全防护：采用先进的信息安全技术和手段，如加密技术、防火墙、入侵检测等，确保客户信息在存储和传输过程中的安全性。\n限制信息访问权限：对参与项目的人员进行严格的权限管理，确保只有经过授权的人员才能访问客户信息。\n定期培训和检查：定期对参与项目的人员进行保密意识和信息安全知识的培训，并定期对信息安全防护措施进行检查和评估，及时发现和消除安全隐患。"},{"i":1140,"t":"简答题","q":"简述科技咨询师在推动科技创新中的作用。","o":"","a":"见答案解析","at":"科技咨询师在推动科技创新中发挥着重要作用。他们通过提供专业的咨询建议，帮助企业和组织识别科技创新的机会和挑战，制定科技创新战略和计划。科技咨询师还能够运用自身的专业知识和经验，协助企业和组织进行技术研发和创新，提升产品和服务的科技含量和竞争力。此外，科技咨询师还能够促进科技成果的转化和应用，推动科技创新与经济发展的深度融合。"},{"i":1141,"t":"简答题","q":"在技术贸易中，如何保护知识产权？","o":"","a":"见答案解析","at":"在技术贸易中，保护知识产权至关重要。可以采取以下措施来保护知识产权：明确知识产权的归属和权益分配，确保双方对知识产权的权益得到合理保障；签订保密协议和技术转让合同，明确双方的权利和义务；加强知识产权的监管和管理，及时发现和打击侵权行为；积极寻求法律支持和援助，维护自身的合法权益。"},{"i":1142,"t":"简答题","q":"简述跟踪服务在科技咨询中的重要性。","o":"","a":"见答案解析","at":"跟踪服务在科技咨询中具有重要意义。通过跟踪服务，咨询师能够及时了解客户在项目实施过程中的进展和遇到的问题，为客户提供持续的支持和帮助。同时，跟踪服务还能够帮助咨询师评估项目的实施效果，总结经验教训，为未来的咨询工作提供参考和借鉴。"},{"i":1143,"t":"简答题","q":"科技咨询项目实施过程中，如何确保项目的质量和进度？","o":"","a":"见答案解析","at":"在科技咨询项目实施过程中，要确保项目的质量和进度，可以采取以下措施：制定详细的项目计划和时间表，明确各阶段的任务和责任人；建立有效的沟通机制，确保团队成员之间的信息共享和协作；定期进行项目检查和评估，及时发现和解决问题；加强项目风险管理，制定应对措施以应对可能出现的风险和挑战。"},{"i":1144,"t":"简答题","q":"市场调研在科技咨询中扮演的角色是什么？","o":"","a":"见答案解析","at":"市场调研在科技咨询中扮演着至关重要的角色。它能够帮助咨询师了解市场需求、竞争格局、客户偏好以及潜在的市场机会和挑战。通过市场调研，咨询师能够为客户提供更加精准的市场分析和策略建议，帮助客户在竞争中脱颖而出。"},{"i":1145,"t":"简答题","q":"简述科技咨询在项目选择阶段的重要性。","o":"","a":"见答案解析","at":"科技咨询在项目选择阶段的重要性体现在能够帮助客户准确识别项目的可行性、市场潜力和技术难点，从而避免盲目投资带来的风险。通过科学的分析和评估，咨询师能够为客户提供专业的建议，帮助客户做出明智的决策。"},{"i":1146,"t":"简答题","q":"技术贸易的主要形式有哪些？","o":"","a":"见答案解析","at":"技术贸易的主要形式包括专利许可、技术转让、技术合作、技术入股以及技术咨询服务等。"},{"i":1147,"t":"简答题","q":"科技咨询项目受理过程中，咨询师需要完成哪些工作？","o":"","a":"见答案解析","at":"在科技咨询项目受理过程中，咨询师需要与客户进行初步沟通，了解客户需求，明确咨询目标和范围，制定咨询计划，并签订咨询合同。"},{"i":1148,"t":"简答题","q":"科技咨询项目选择的原则是什么？","o":"","a":"见答案解析","at":"科技咨询项目选择的原则包括符合国家政策导向、市场需求明确、技术可行性高、经济效益显著以及符合咨询师的专业能力和经验等。"},{"i":1149,"t":"简答题","q":"在市场调研中，常用的数据收集方法有哪些？","o":"","a":"见答案解析","at":"市场调研中常用的数据收集方法包括问卷调查、访谈调查、观察法、实验法和二手资料收集等。"},{"i":1150,"t":"简答题","q":"科技咨询的基本概念是什么？","o":"","a":"见答案解析","at":"科技咨询是指运用现代科技知识、方法和手段，为经济和社会发展中的各类组织和个人提供科学性、系统性、综合性的咨询服务活动。"},{"i":1151,"t":"判断题","q":"数据备份是信息管理中保证数据安全的主要手段之一。（ ）","o":"","a":"正确","at":"正确"},{"i":1152,"t":"判断题","q":"在所有情况下，书面交流都比口头交流更正式和可靠。（ ）","o":"","a":"错误","at":"错误"},{"i":1153,"t":"判断题","q":"规避招标只发生在招标过程中，与投标方无关。（ ）","o":"","a":"错误","at":"错误"},{"i":1154,"t":"判断题","q":"企业只能通过发行股票来进行直接融资。（ ）","o":"","a":"错误","at":"错误"},{"i":1155,"t":"判断题","q":"投标保证金必须以现金形式提交。（ ）","o":"","a":"错误","at":"错误"},{"i":1156,"t":"判断题","q":"细分的市场必须是可以识别和测量的。（ ）","o":"","a":"正确","at":"正确"},{"i":1157,"t":"判断题","q":"技术市场中的技术交易都是公平公正的。（ ）","o":"","a":"错误","at":"错误"},{"i":1158,"t":"判断题","q":"客户的需求类型主要包括功能需求、形式需求、外延需求和价格需求，其中功能需求仅指产品的主导功能需求，即产品的核心功能。（ const TOTAL = QUESTIONS.length;

const KEY_POS = 'quiz_pos';
const KEY_REVIEW = 'quiz_review';
const KEY_ANSWERS = 'quiz_answers';
const KEY_REVEALED = 'quiz_revealed';

let currentIdx = 0;
let reviewSet = new Set();
let answerMap = {};
let revealedSet = new Set();

function loadStorage() {
  currentIdx = parseInt(localStorage.getItem(KEY_POS) || '0');
  if (currentIdx >= TOTAL) currentIdx = 0;
  if (currentIdx < 0) currentIdx = 0;
  try {
    reviewSet = new Set(JSON.parse(localStorage.getItem(KEY_REVIEW) || '[]'));
  } catch(e) { reviewSet = new Set(); }
  try {
    answerMap = JSON.parse(localStorage.getItem(KEY_ANSWERS) || '{}');
  } catch(e) { answerMap = {}; }
  try {
    revealedSet = new Set(JSON.parse(localStorage.getItem(KEY_REVEALED) || '[]'));
  } catch(e) { revealedSet = new Set(); }
}

function saveStorage() {
  localStorage.setItem(KEY_POS, currentIdx.toString());
  localStorage.setItem(KEY_REVIEW, JSON.stringify([...reviewSet]));
  localStorage.setItem(KEY_ANSWERS, JSON.stringify(answerMap));
  localStorage.setItem(KEY_REVEALED, JSON.stringify([...revealedSet]));
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderQuestion() {
  const q = QUESTIONS[currentIdx];
  const container = document.getElementById('questionContainer');

  let optsHtml = '';
  const isJudge = q.t === '判断题';
  const isShort = q.t === '简答题';

  var isRevealed = revealedSet.has(q.i);
  var ans = answerMap[q.i];
  var showAnswer = true;

  if (q.o) {
    const opts = q.o.split('||');
    for (const optStr of opts) {
      const parts = optStr.split('|');
      const letter = parts[0];
      const text = parts[1] || '';
      const isRight = parts[2] === '1';
      let cls = 'q-opt';
      if (isJudge) cls += ' judge';
      if (showAnswer) {
        if (ans && ans.selected === letter && !isRight) {
          cls += ' wrong';
        } else if (isRight) {
          cls += ' correct';
        }
      }
      const mark = showAnswer && isRight ? ' &check;' : '';
      const wrongMark = showAnswer && ans && ans.selected === letter && !isRight ? ' &times;' : '';
      optsHtml += '<div class="' + cls + '" onclick="selectOption(\'' + letter + '\', ' + (isRight ? 1 : 0) + ')">' +
        '<span class="letter">' + letter + '</span>' +
        '<span class="opt-text">' + escapeHtml(text) + mark + wrongMark + '</span>' +
        '</div>';
    }
  }

  var answerHtml = '';
  if (isShort) {
    answerHtml = '<div class="short-answer"><div class="label">参考答案：</div>' +
      '<div class="text">' + escapeHtml(q.at || q.a || '无标准答案') + '</div></div>';
  } else {
    answerHtml = '<div class="q-answer' + (showAnswer ? ' show' : '') + '">' +
      '<div class="label">正确答案：' + escapeHtml(q.a) + '</div>' +
      (q.at && q.at !== q.a ? '<div class="text">' + escapeHtml(q.at) + '</div>' : '') +
      '</div>';
  }

  var showBtnHtml = '';

  const isChecked = reviewSet.has(q.i) ? 'checked' : '';

  container.innerHTML = '<div class="q-card" id="qCard">' +
    '<div class="q-meta"><div class="q-num">' + q.i + '</div>' +
    '<span class="q-type">' + q.t + '</span></div>' +
    '<div class="q-title">' + escapeHtml(q.q) + '</div>' +
    '<div class="q-options">' + optsHtml + '</div>' +
    showBtnHtml +
    answerHtml +
    '<div class="mark-bar"><div class="mark-familiar">' +
    '<input type="checkbox" id="markReview" ' + isChecked + ' onchange="toggleReview(' + q.i + ')">' +
    '<label for="markReview">⭐ 标记不熟悉</label></div></div>' +
    '</div>';

  document.getElementById('progressInfo').textContent = (currentIdx + 1) + ' / ' + TOTAL;
  document.getElementById('progressFill').style.width = ((currentIdx + 1) / TOTAL * 100).toFixed(1) + '%';
  document.getElementById('topTitle').textContent = '第' + q.i + '题';

  updateStats();
  updateReviewBadge();
  document.getElementById('content').scrollTop = 0;
}

function revealAnswer() {
  const q = QUESTIONS[currentIdx];
  revealedSet.add(q.i);
  saveStorage();
  renderQuestion();
}

function jumpToType(typeName) {
  var idx = QUESTIONS.findIndex(function(x) { return x.t === typeName; });
  if (idx >= 0) {
    currentIdx = idx;
    saveStorage();
    renderQuestion();
  }
}

function selectOption(letter, isRight) {
  const q = QUESTIONS[currentIdx];
  if (answerMap[q.i] && answerMap[q.i].selected) return;
  answerMap[q.i] = { selected: letter, correct: isRight === 1 };
  saveStorage();
  renderQuestion();
}

function toggleReview(idx) {
  if (reviewSet.has(idx)) {
    reviewSet.delete(idx);
  } else {
    reviewSet.add(idx);
  }
  saveStorage();
  updateReviewBadge();
  updateStats();
}

function updateReviewBadge() {
  const badge = document.getElementById('reviewBadge');
  if (reviewSet.size > 0) {
    badge.textContent = reviewSet.size;
    badge.style.display = 'block';
  } else {
    badge.style.display = 'none';
  }
}

function updateStats() {
  var el = document.getElementById('statReview');
  if (el) el.textContent = reviewSet.size;
}

function nextQuestion() {
  if (currentIdx < TOTAL - 1) {
    currentIdx++;
    saveStorage();
    renderQuestion();
  } else {
    alert('已是最后一题！');
  }
}

function prevQuestion() {
  if (currentIdx > 0) {
    currentIdx--;
    saveStorage();
    renderQuestion();
  }
}

function showJumpModal() {
  document.getElementById('jumpInput').value = currentIdx + 1;
  document.getElementById('jumpModal').classList.add('show');
  setTimeout(function() { document.getElementById('jumpInput').focus(); }, 100);
}

function hideJumpModal() {
  document.getElementById('jumpModal').classList.remove('show');
}

function doJump() {
  const val = parseInt(document.getElementById('jumpInput').value);
  if (isNaN(val) || val < 1 || val > TOTAL) {
    alert('请输入1到' + TOTAL + '之间的数字');
    return;
  }
  currentIdx = val - 1;
  saveStorage();
  renderQuestion();
  hideJumpModal();
}

function showReviewModal() {
  const content = document.getElementById('reviewContent');
  if (reviewSet.size === 0) {
    content.innerHTML = '<div class="review-empty">暂无标记题目<br><br>在做题时勾选"⭐ 标记不熟悉"即可添加到这里</div>';
  } else {
    let html = '';
    const sorted = [...reviewSet].sort(function(a, b) { return a - b; });
    for (const idx of sorted) {
      const q = QUESTIONS.find(function(x) { return x.i === idx; });
      if (!q) continue;
      const ans = answerMap[idx];
      let ansStr = '';
      if (q.t === '简答题') {
        ansStr = (q.at || q.a || '无标准答案').substring(0, 80);
      } else {
        ansStr = '正确答案：' + q.a + (q.at ? ' | ' + q.at.substring(0, 60) : '');
      }
      let statusHtml = ans ? (ans.correct ? '<span style="color:var(--green-dark);font-size:11px">✓ 已答对</span>' : '<span style="color:var(--red);font-size:11px">✗ 答错了</span>') : '<span style="color:var(--text-light);font-size:11px">未作答</span>';
      html += '<div class="review-item">' +
        '<div class="ri-meta"><div class="ri-num">' + q.i + '</div>' +
        '<span class="ri-type">' + q.t + '</span>' + statusHtml + '</div>' +
        '<div class="ri-title">' + escapeHtml(q.q.substring(0, 100)) + (q.q.length > 100 ? '...' : '') + '</div>' +
        '<div class="ri-answer">' + escapeHtml(ansStr) + '</div>' +
        '<button class="ri-go" onclick="jumpToReview(' + q.i + ')">去练习</button>' +
        '<button class="ri-remove" onclick="removeReview(' + q.i + ')">移除</button>' +
        '</div>';
    }
    content.innerHTML = html;
  }
  document.getElementById('reviewModal').classList.add('show');
}

function hideReviewModal() {
  document.getElementById('reviewModal').classList.remove('show');
}

function jumpToReview(idx) {
  currentIdx = QUESTIONS.findIndex(function(x) { return x.i === idx; });
  saveStorage();
  renderQuestion();
  hideReviewModal();
}

function removeReview(idx) {
  reviewSet.delete(idx);
  saveStorage();
  updateReviewBadge();
  showReviewModal();
}

function clearReview() {
  if (reviewSet.size === 0) return;
  if (confirm('确定清空全部' + reviewSet.size + '条复习标记吗？')) {
    reviewSet.clear();
    saveStorage();
    updateReviewBadge();
    showReviewModal();
  }
}

document.addEventListener('keydown', function(e) {
  if (document.getElementById('jumpModal').classList.contains('show')) {
    if (e.key === 'Enter') doJump();
    if (e.key === 'Escape') hideJumpModal();
    return;
  }
  if (document.getElementById('reviewModal').classList.contains('show')) {
    if (e.key === 'Escape') hideReviewModal();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevQuestion();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextQuestion();
});

var touchStartX = 0, touchStartY = 0;
document.getElementById('content').addEventListener('touchstart', function(e) {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
});
document.getElementById('content').addEventListener('touchend', function(e) {
  var touchEndX = e.changedTouches[0].screenX;
  var touchEndY = e.changedTouches[0].screenY;
  var diffX = touchStartX - touchEndX;
  var diffY = touchStartY - touchEndY;
  if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 2) {
    if (diffX > 0) nextQuestion();
    else prevQuestion();
  }
});

loadStorage();
renderQuestion();
</script>
</body>
</html>
