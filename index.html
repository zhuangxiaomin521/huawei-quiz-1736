"}];
const TOTAL = ALL.length;

// 进度记忆
const POS_KEY = 'quiz_ai5_pos';
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
    if (p && typeof p.type === 'string' && typeof p.idx === 'number') return p;
  } catch(e) {}
  return null;
}
function saveProgress() {
  localStorage.setItem(POS_KEY, JSON.stringify({ type: currentType, idx: currentIdx }));
}

let currentType = '全部';
let currentIdx = 0;
// 恢复上次进度
(function initProgress() {
  const p = loadProgress();
  if (p) {
    currentType = p.type || '全部';
    currentIdx = p.idx || 0;
  }
})();

function getFiltered() {
  if (currentType === '全部') return ALL;
  return ALL.filter(q => q.t === currentType);
}

function renderQuestion() {
  const list = getFiltered();
  if (list.length === 0) {
    document.getElementById('questionContainer').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-light)">该类型暂无题目</div>';
    return;
  }
  const q = list[currentIdx];
  const container = document.getElementById('questionContainer');
  const isJudge = q.t === '判断题';
  let optsHtml = '';
  const answered = answerMap[q.i];
  const showFeedback = true;  // 直接显示答案，便于复习
  if (q.o) {
    const opts = q.o.split('||');
    for (const optStr of opts) {
      const parts = optStr.split('|');
      const letter = parts[0];
      const text = parts[1] || '';
      const isRight = parts[2] === '1';
      let cls = 'q-opt' + (isJudge ? ' judge' : '');
      if (showFeedback) {
        if (answered === letter && !isRight) {
          cls += ' wrong';
        } else if (answered === letter && isRight) {
          cls += ' correct';
        } else if (isRight) {
          cls += ' correct';
        }
      }
      const mark = showFeedback && isRight ? ' &check;' : '';
      const wrongMark = showFeedback && answered === letter && !isRight ? ' &times;' : '';
      optsHtml += '<div class="' + cls + '" onclick="selectOption(\'' + letter + '\')">' +
        '<span class="letter">' + letter + '</span>' +
        '<span class="opt-text">' + escapeHtml(text) + mark + wrongMark + '</span></div>';
    }
  }
  let answerHtml = showFeedback ? '<div class="q-answer show">' : '<div class="q-answer">';
    '<div class="label">正确答案：' + escapeHtml(q.a) + '</div>' +
    (q.at && q.at !== q.a ? '<div class="text">' + escapeHtml(q.at) + '</div>' : '') +
    '</div>';
  const isChecked = reviewSet.has(q.i) ? 'checked' : '';

  container.innerHTML = '<div class="q-card">' +
    '<div class="q-meta"><div class="q-num">' + q.i + '</div>' +
    '<span class="q-type">' + q.t + '</span></div>' +
    '<div class="q-title">' + escapeHtml(q.q) + '</div>' +
    '<div class="q-options">' + optsHtml + '</div>' +
    answerHtml +
    '<div class="mark-bar"><div class="mark-familiar">' +
    '<input type="checkbox" id="markReview" ' + isChecked + ' onchange="toggleReview(' + q.i + ')">' +
    '<label for="markReview">⭐ 标记不熟悉</label></div></div>' +
    '</div>';

  document.getElementById('progressInfo').textContent = (currentIdx + 1) + ' / ' + list.length;
  document.getElementById('content').scrollTop = 0;
  saveProgress();
}

// 同步题型标签高亮状态
function syncTypeTabs() {
  document.querySelectorAll('.type-tab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-type') === currentType);
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filterByType(type) {
  currentType = type;
  currentIdx = 0;
  document.querySelectorAll('.type-tab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-type') === type);
  });
  renderQuestion();
}

function selectOption(letter) {
  const list = getFiltered();
  if (list.length === 0) return;
  const q = list[currentIdx];
  if (answerMap[q.i]) return;  // 已作答
  answerMap[q.i] = letter;
  saveAnswers();
  renderQuestion();
}

let answerMap = {};
const ANS_KEY = 'quiz_ai5_ans';
try { answerMap = JSON.parse(localStorage.getItem(ANS_KEY) || '{}'); } catch(e) { answerMap = {}; }
function saveAnswers() {
  localStorage.setItem(ANS_KEY, JSON.stringify(answerMap));
}

function prevQuestion() {
  console.log('prev: ' + currentIdx);
  if (currentIdx > 0) { currentIdx--; renderQuestion(); }
}

function nextQuestion() {
  console.log('next: ' + currentIdx);
  const list = getFiltered();
  if (currentIdx < list.length - 1) { currentIdx++; renderQuestion(); }
  else alert('已是本类最后一题！');
}

function toggleReview(idx) {
  const cb = document.getElementById('markReview');
  if (cb.checked) reviewSet.add(idx);
  else reviewSet.delete(idx);
  saveReview();
}

function loadFullQuestion() {
  renderQuestion();
}

const REVIEW_KEY = 'quiz_ai5_review';
let reviewSet = new Set();
try { reviewSet = new Set(JSON.parse(localStorage.getItem(REVIEW_KEY) || '[]')); } catch(e) { reviewSet = new Set(); }
function saveReview() {
  localStorage.setItem(REVIEW_KEY, JSON.stringify([...reviewSet]));
}

syncTypeTabs();
renderQuestion();
</script>
